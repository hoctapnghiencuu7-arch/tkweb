<!DOCTYPE html>
<html lang="vi">
<head>
  <script src="../js/core-store.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản - FlyNest</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <!-- Phông chữ tiếng Việt chuẩn đẹp số 1: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <!-- FlyNest Reusable Header -->
<header style="background: #ffffff; border-bottom: 1px solid var(--c-border); width: 100%; position: sticky; top: 0; z-index: 50;">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;">
    
    <!-- Logo -->
    <a href="../index.html" class="fn-logo-link" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--c-text-main); font-weight: bold; font-size: 24px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      FlyNest
    </a>

    <!-- Navigation -->
    <nav>
      <ul style="display: flex; gap: 32px; list-style: none; margin: 0; padding: 0;">
        <li><a href="../index.html" class="fn-nav-link" style="text-decoration: none; color: var(--c-text-main); font-weight: 500;">Trang chủ</a></li>
        <li><a href="../pages/flights.html" class="fn-nav-link" style="text-decoration: none; color: var(--c-text-main); font-weight: 500;">Chuyến bay</a></li>
        <li><a href="../pages/booking.html" class="fn-nav-link" style="text-decoration: none; color: var(--c-text-main); font-weight: 500;">Đặt vé</a></li>
        <li><a href="../pages/schedule.html" class="fn-nav-link" style="text-decoration: none; color: var(--c-text-main); font-weight: 500;">Lịch trình</a></li>
      </ul>
    </nav>

    <!-- Actions -->
    <div style="display: flex; gap: 16px; align-items: center;">
      <a href="../pages/login.html" class="fn-clickable fn-btn-outline" style="text-decoration: none; font-weight: 600; padding: 8px 20px; border-radius: 8px;">Đăng nhập</a>
      <a href="../pages/register.html" class="fn-clickable fn-btn-primary" style="text-decoration: none; font-weight: 600; padding: 8px 20px; border-radius: 8px;">Đăng ký</a>
    </div>

  </div>
</header>


  <!-- Auth Main Container -->
  <main class="auth-page-container">



    <div class="auth-card-ngefly">
      
      <div class="auth-header">
        <div class="auth-logo-badge">✨</div>
        <h1 class="auth-title">Gia Nhập FlyNest</h1>
        <p class="auth-subtitle">Mở khóa giá vé thành viên độc quyền, xuất thẻ bay tức thì và tích lũy dặm bay</p>
      </div>

      <!-- Social Logins -->
      <button type="button" class="btn-social-auth" id="reg-google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/>
        </svg>
        Đăng ký với Google
      </button>

      <div class="auth-divider">
        <span>hoặc đăng ký bằng email</span>
      </div>

      <form id="register-form" action="javascript:void(0);">
        <div class="auth-input-group">
          <label for="reg-name">Họ và Tên (Theo Giấy Tờ Tùy Thân)</label>
          <input type="text" id="reg-name" name="name" class="auth-input-control" placeholder="Nguyễn Văn A" autocomplete="name" required style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; width: 100%; display: block; box-sizing: border-box; color: #000000; margin-bottom: 16px;" >
        </div>

        <div class="auth-input-group">
          <label for="reg-email">Địa Chỉ Email</label>
          <input type="email" id="reg-email" name="email" class="auth-input-control" placeholder="name@example.com" autocomplete="email" required style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; width: 100%; display: block; box-sizing: border-box; color: #000000; margin-bottom: 16px;" >
        </div>

        <div class="auth-input-group">
          <label for="reg-phone">Số Điện Thoại</label>
          <input type="tel" id="reg-phone" name="phone" class="auth-input-control" placeholder="+84 901 234 567" autocomplete="tel" required style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; width: 100%; display: block; box-sizing: border-box; color: #000000; margin-bottom: 16px;" >
        </div>

        <div class="auth-input-group">
          <label for="reg-password">Mật Khẩu</label>
          <input type="password" id="reg-password" name="password" class="auth-input-control" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" required style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; width: 100%; display: block; box-sizing: border-box; color: #000000; margin-bottom: 16px;" >
        </div>

        <div style="display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 1.5rem; font-size: 0.84rem; color: var(--text-muted);">
          <input type="checkbox" id="terms-agree" name="terms" checked style="accent-color: var(--accent-orange); width: 18px; height: 18px; margin-top: 2px;" required style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; width: 100%; display: block; box-sizing: border-box; color: #000000; margin-bottom: 16px;" >
          <label for="terms-agree" style="cursor: pointer;">
            Tôi đồng ý với <a href="javascript:void(0);" onclick="alert('Điều khoản dịch vụ FlyNest: Hệ thống đồ án thực hành AI Web Development 2026.');" style="color: var(--accent-orange); font-weight: 700;">Điều khoản dịch vụ</a> &amp; <a href="javascript:void(0);" onclick="alert('Chính sách bảo mật: Thông tin người dùng chỉ được lưu cục bộ để kiểm thử.');" style="color: var(--accent-orange); font-weight: 700;">Chính sách bảo mật</a> của FlyNest.
          </label>
        </div>

        <button type="submit" class="btn-view-details" style="width: 100%; padding: 0.85rem; font-size: 1.05rem;">
          Tạo Tài Khoản Miễn Phí ➔
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--text-muted);">
        Đã có tài khoản? <a href="login.html" style="color: var(--accent-orange); font-weight: 800;">Đăng nhập ngay</a>
      </div>

    </div>
  </main>

  <!-- ==================== CHÂN TRANG CAO CẤP (AVIATION LUXURY FOOTER) ==================== -->
  <footer style="background: #ffffff; border-top: 1px solid var(--c-border); padding: 40px 20px; text-align: center; color: var(--c-text-sub); margin-top: auto;">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 20px; color: var(--c-text-main);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      FlyNest
    </div>
    <div style="font-size: 14px;">Bản quyền &copy; 2026 FlyNest. Đã đăng ký bản quyền.</div>
  </div>
</footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
