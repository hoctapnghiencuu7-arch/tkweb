<!DOCTYPE html>
<html lang="vi">
<head>
  <script src="../js/core-store.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Tài Khoản - FlyNest</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <!-- Phông chữ tiếng Việt chuẩn đẹp số 1: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <!-- FlyNest Reusable Header -->
<header style="background: #ffffff; border-bottom: 1px solid var(--c-border); width: 100%; position: sticky; top: 0; z-index: 50;">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;">
    
    <!-- Logo -->
    <a href="../index.html" class="fn-logo-link" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--c-text-main); font-weight: bold; font-size: 24px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      FlyNest
    </a>

    <!-- Navigation -->
    <nav>
      <ul style="display: flex; gap: 32px; list-style: none; margin: 0; padding: 0;">
        <li><a href="../index.html" class="fn-nav-link" style="text-decoration: none; color: var(--c-text-main); font-weight: 500;">Trang chủ</a></li>
        <li><a href="../pages/flights.html" class="fn-nav-link" style="text-decoration: none; color: var(--c-text-main); font-weight: 500;">Chuyến bay</a></li>
        <li><a href="../pages/booking.html" class="fn-nav-link" style="text-decoration: none; color: var(--c-text-main); font-weight: 500;">Đặt vé</a></li>
        <li><a href="../pages/schedule.html" class="fn-nav-link" style="text-decoration: none; color: var(--c-text-main); font-weight: 500;">Lịch trình</a></li>
      </ul>
    </nav>

    <!-- Actions -->
    <div style="display: flex; gap: 16px; align-items: center;">
      <a href="../pages/login.html" class="fn-clickable fn-btn-outline" style="text-decoration: none; font-weight: 600; padding: 8px 20px; border-radius: 8px;">Đăng nhập</a>
      <a href="../pages/register.html" class="fn-clickable fn-btn-primary" style="text-decoration: none; font-weight: 600; padding: 8px 20px; border-radius: 8px;">Đăng ký</a>
    </div>

  </div>
</header>


  <!-- Auth Main Container -->
  <main class="auth-page-container">



    <div class="auth-card-ngefly">
      
      <div class="auth-header">
        <div class="auth-logo-badge">✈</div>
        <h1 class="auth-title">Chào Mừng Trở Lại</h1>
        <p class="auth-subtitle">Đăng nhập để quản lý lịch trình bay và vé điện tử PNR của bạn</p>
      </div>

      <!-- Social Logins -->
      <button type="button" class="btn-social-auth" id="login-google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/>
        </svg>
        Tiếp tục với Google
      </button>

      <button type="button" class="btn-social-auth" id="login-apple-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 .6-2.65 1.35-.58.67-1.09 1.74-.95 2.77 1.01.08 2.05-.52 2.67-1.27z"/>
        </svg>
        Tiếp tục với Apple ID
      </button>

      <div class="auth-divider">
        <span>hoặc đăng nhập bằng email</span>
      </div>

      <form id="login-form" action="javascript:void(0);">
        <div class="auth-input-group">
          <label for="login-email">Địa Chỉ Email</label>
          <input type="email" id="login-email" name="email" class="auth-input-control" placeholder="name@example.com" value="jonathan.ben@example.com" autocomplete="username email" required style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; width: 100%; display: block; box-sizing: border-box; color: #000000; margin-bottom: 16px;" >
        </div>

        <div class="auth-input-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="login-password" style="margin-bottom: 0;">Mật Khẩu</label>
            <button type="button" onclick="alert('Tính năng khôi phục mật khẩu: Vui lòng liên hệ tổng đài FlyNest hoặc sử dụng tài khoản kiểm thử demo.');" style="background:none; border:none; padding:0; font-size: 0.8rem; color: var(--accent-orange); font-weight: 700; cursor: pointer;">Quên mật khẩu?</button>
          </div>
          <input type="password" id="login-password" name="password" class="auth-input-control" placeholder="••••••••" autocomplete="current-password" required style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; width: 100%; display: block; box-sizing: border-box; color: #000000; margin-bottom: 16px;" >
        </div>

        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; font-size: 0.88rem;">
          <input type="checkbox" id="remember-me" name="remember" checked style="accent-color: var(--accent-orange); width: 18px; height: 18px;">
          <label for="remember-me" style="color: var(--text-muted); cursor: pointer;">Ghi nhớ thiết bị này trong 30 ngày</label>
        </div>

        <button type="submit" class="btn-view-details" style="width: 100%; padding: 0.85rem; font-size: 1.05rem;">
          Đăng Nhập Vào FlyNest ➔
        </button>

        <div style="margin-top: 1rem; border-top: 1px dashed var(--border-subtle); padding-top: 0.85rem;">
          <button type="button" id="btn-quick-admin-login" style="width: 100%; padding: 0.65rem 1rem; border-radius: var(--radius-md); border: 1.5px dashed var(--accent-orange); background: rgba(255, 95, 56, 0.06); color: var(--accent-orange); font-size: 0.84rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.45rem;">
            <span>🔑 Đăng Nhập Nhanh Quản Trị Viên (Admin Demo)</span>
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--text-muted);">
        Chưa có tài khoản? <a href="register.html" style="color: var(--accent-orange); font-weight: 800;">Đăng ký miễn phí ngay</a>
      </div>

    </div>
  </main>

  <!-- ==================== CHÂN TRANG CAO CẤP (AVIATION LUXURY FOOTER) ==================== -->
  <footer style="background: #ffffff; border-top: 1px solid var(--c-border); padding: 40px 20px; text-align: center; color: var(--c-text-sub); margin-top: auto;">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 20px; color: var(--c-text-main);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      FlyNest
    </div>
    <div style="font-size: 14px;">Bản quyền &copy; 2026 FlyNest. Đã đăng ký bản quyền.</div>
  </div>
</footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
