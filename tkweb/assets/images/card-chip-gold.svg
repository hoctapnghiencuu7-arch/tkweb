<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="100%" height="100%">
  <defs>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="chipShine" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Gold Chip Plate -->
  <rect x="5" y="5" width="110" height="80" rx="14" fill="url(#goldPlate)" stroke="#713f12" stroke-width="1.8" filter="url(#chipShine)"/>
  
  <!-- Subtle Internal Embossed Bevel -->
  <rect x="7" y="7" width="106" height="76" rx="12" fill="none" stroke="url(#goldHighlight)" stroke-width="1.5"/>

  <!-- Authentic EMV Circuit Contact Trace Grooves -->
  <g stroke="#713f12" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Horizontal Center Dividers -->
    <line x1="5" y1="45" x2="38" y2="45"/>
    <line x1="82" y1="45" x2="115" y2="45"/>

    <!-- Central Micro-Pad Frame -->
    <rect x="38" y="24" width="44" height="42" rx="7" fill="none" stroke="#713f12" stroke-width="2"/>

    <!-- Top Traces -->
    <line x1="38" y1="24" x2="18" y2="10"/>
    <line x1="60" y1="5" x2="60" y2="24"/>
    <line x1="82" y1="24" x2="102" y2="10"/>

    <!-- Bottom Traces -->
    <line x1="38" y1="66" x2="18" y2="80"/>
    <line x1="60" y1="66" x2="60" y2="85"/>
    <line x1="82" y1="66" x2="102" y2="80"/>

    <!-- Inner Microchip Security Core Ring -->
    <circle cx="60" cy="45" r="7" fill="none" stroke="#713f12" stroke-width="1.8"/>
  </g>
  <!-- Gold Lustre Accent -->
  <path d="M 12,12 L 45,12 L 20,40 Z" fill="#ffffff" opacity="0.25"/>
</svg>