<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bagHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Telescopic Handle -->
  <path d="M 18,14 L 18,5 C 18,3.5 19.5,2 21,2 L 27,2 C 28.5,2 30,3.5 30,5 L 30,14" fill="none" stroke="url(#bagHandle)" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="20" y="2" width="8" height="3" rx="1.5" fill="#0f172a"/>

  <!-- Suitcase Main Hard-Shell Body -->
  <rect x="11" y="13" width="26" height="30" rx="5" fill="url(#bagGrad)" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Protective Rubber Corner Bumpers -->
  <path d="M 11,18 C 11,15.2 13.2,13 16,13" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M 37,18 C 37,15.2 34.8,13 32,13" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M 11,38 C 11,40.8 13.2,43 16,43" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M 37,38 C 37,40.8 34.8,43 32,43" fill="none" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Horizontal Embossed Ribs -->
  <line x1="16" y1="21" x2="32" y2="21" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  <line x1="16" y1="28" x2="32" y2="28" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  <line x1="16" y1="35" x2="32" y2="35" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>

  <!-- Luggage Tag -->
  <rect x="14" y="16" width="4" height="6" rx="1" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>

  <!-- Dual Spinner Wheels -->
  <circle cx="16" cy="45" r="2.5" fill="#0f172a"/>
  <circle cx="16" cy="45" r="1" fill="#cbd5e1"/>
  <circle cx="32" cy="45" r="2.5" fill="#0f172a"/>
  <circle cx="32" cy="45" r="1" fill="#cbd5e1"/>
</svg>