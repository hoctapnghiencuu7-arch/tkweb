<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="seatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Headrest -->
  <rect x="9" y="5" width="12" height="7" rx="3.5" fill="url(#seatGrad)" stroke="#1e40af" stroke-width="1.2"/>

  <!-- Reclining Seat Backrest -->
  <path d="M 12,12 L 17,29 C 17.5,31 19,32.5 21,33 L 34,33" fill="none" stroke="url(#seatGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ergonomic Seat Cushion -->
  <rect x="18" y="30" width="18" height="6" rx="3" fill="url(#seatGrad)" stroke="#1e40af" stroke-width="1.2"/>

  <!-- Executive Armrest -->
  <path d="M 18,23 L 30,23 C 31.5,23 32.5,24 32.5,25.5 L 32.5,30" fill="none" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Seat Base / Floor Mounting Track -->
  <line x1="22" y1="36" x2="22" y2="43" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="43" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="43" x2="38" y2="43" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sparkle Feature Indicator (Luxury Crown) -->
  <polygon points="36,8 37,11 40,11 37.5,13 38.5,16 36,14.5 33.5,16 34.5,13 32,11 35,11" fill="#facc15"/>
</svg>