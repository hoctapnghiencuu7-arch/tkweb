      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Outer Wi-Fi Wave -->
  <path d="M 6,15 C 16,5 32,5 42,15" fill="none" stroke="url(#wifiGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Middle Wi-Fi Wave -->
  <path d="M 12,22 C 19,15 29,15 36,22" fill="none" stroke="url(#wifiGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Inner Wi-Fi Wave -->
  <path d="M 18,29 C 22,25 26,25 30,29" fill="none" stroke="url(#wifiGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center Wi-Fi Origin Disc -->
