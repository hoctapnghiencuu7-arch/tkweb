<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="clockRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Outer Chronometer Dial -->
  <circle cx="24" cy="24" r="19" fill="#ffffff" stroke="url(#clockRing)" stroke-width="3"/>
  <circle cx="24" cy="24" r="15" fill="#f8fafc"/>

  <!-- 12, 3, 6, 9 Hour Indices -->
  <line x1="24" y1="11" x2="24" y2="14" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="24" x2="34" y2="24" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="37" x2="24" y2="34" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="24" x2="14" y2="24" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Clock Hands (01h 07m Flight Duration) -->
  <!-- Hour Hand -->
  <line x1="24" y1="24" x2="24" y2="17" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute Hand pointing at ~15-20 min -->
  <line x1="24" y1="24" x2="32" y2="21" stroke="#ff6b00" stroke-width="2" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="24" cy="24" r="2.5" fill="#ff6b00"/>
</svg>