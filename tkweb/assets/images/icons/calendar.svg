<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Card Base -->
  <rect x="6" y="10" width="36" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Red/Orange Month Header Bar -->
  <path d="M 6,15 C 6,12.2 8.2,10 11,10 L 37,10 C 39.8,10 42,12.2 42,15 L 42,18 L 6,18 Z" fill="url(#calHeader)"/>

  <!-- Binder Rings -->
  <rect x="14" y="5" width="4" height="8" rx="2" fill="#334155"/>
  <rect x="30" y="5" width="4" height="8" rx="2" fill="#334155"/>

  <!-- Calendar Day Grid Dots -->
  <circle cx="14" cy="24" r="2" fill="#94a3b8"/>
  <circle cx="21" cy="24" r="2" fill="#94a3b8"/>
  <circle cx="28" cy="24" r="2" fill="#94a3b8"/>
  <circle cx="35" cy="24" r="2" fill="#94a3b8"/>

  <!-- Selected Flight Date (Highlighted with Orange Badge) -->
  <rect x="18" y="29" width="12" height="9" rx="3" fill="#ff6b00"/>
  <text x="24" y="36.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7" fill="#ffffff" text-anchor="middle">20</text>

  <circle cx="14" cy="33" r="2" fill="#94a3b8"/>
  <circle cx="35" cy="33" r="2" fill="#94a3b8"/>
</svg>