<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="gateFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="scannerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Security Scanner Arch Portal -->
  <!-- Left Pillar -->
  <rect x="7" y="6" width="6" height="38" rx="2" fill="url(#gateFrame)"/>
  <!-- Right Pillar -->
  <rect x="35" y="6" width="6" height="38" rx="2" fill="url(#gateFrame)"/>
  <!-- Overhead Transom Sensor Unit -->
  <rect x="5" y="5" width="38" height="7" rx="2" fill="#0f172a"/>
  <!-- Green Clearance Status Light -->
  <circle cx="24" cy="8.5" r="2.5" fill="#10b981"/>

  <!-- Safe Biometric Laser Scanning Field -->
  <rect x="13" y="12" width="22" height="28" fill="url(#scannerBeam)"/>
  <line x1="13" y1="20" x2="35" y2="20" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,3"/>
  <line x1="13" y1="30" x2="35" y2="30" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,3"/>

  <!-- Passenger Clearance / Boarding Pass Silhouette passing through -->
  <circle cx="24" cy="22" r="3.5" fill="#ffffff"/>
  <path d="M 19,37 C 19,30 29,30 29,37 Z" fill="#ffffff"/>

  <!-- Base Stabilization Plates -->
  <rect x="4" y="42" width="12" height="3" rx="1" fill="#334155"/>
  <rect x="32" y="42" width="12" height="3" rx="1" fill="#334155"/>
</svg>