<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vjRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="vjYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="url(#vjRed)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="#fff5f5"/>

  <!-- Dynamic Flying Ribbon / Bird Wings -->
  <g transform="translate(50, 50)">
    <!-- Red Flying Wing -->
    <path d="M -30,-8 C -14,-22 10,-20 30,-4 C 14,-12 -4,-10 -18,2 Z" fill="url(#vjRed)"/>
    <!-- Yellow Joy Ribbon -->
    <path d="M -24,8 C -8,-4 14,-2 28,12 C 12,4 -2,4 -14,16 Z" fill="url(#vjYellow)"/>
    <!-- Star Accent -->
    <polygon points="26,-16 28,-10 34,-8 29,-4 30,2 25,-1 20,2 21,-4 16,-8 22,-10" fill="url(#vjYellow)"/>
  </g>
</svg>