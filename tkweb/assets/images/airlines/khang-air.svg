<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="khangBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="khangEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="khangGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="46" fill="url(#khangBg)" stroke="url(#khangEmerald)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#047857" stroke-width="1.2"/>

  <!-- Stylized Modern Emerald Lotus Blossom & Soaring Wings -->
  <g transform="translate(50, 52)">
    <!-- Central Soaring Petal (Aircraft Nose) -->
    <path d="M 0,-30 C 6,-18 10,-2 0,16 C -10,-2 -6,-18 0,-30 Z" fill="url(#khangGold)"/>
    <line x1="0" y1="-28" x2="0" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.75"/>

    <!-- Left Wing Petals -->
    <path d="M -2,-18 C -14,-14 -32,-2 -34,10 C -22,14 -12,4 -2,8 Z" fill="url(#khangEmerald)"/>
    <path d="M -3,-6 C -12,2 -24,14 -20,22 C -12,22 -6,14 -1,13 Z" fill="#059669"/>

    <!-- Right Wing Petals -->
    <path d="M 2,-18 C 14,-14 32,-2 34,10 C 22,14 12,4 2,8 Z" fill="url(#khangEmerald)"/>
    <path d="M 3,-6 C 12,2 24,14 20,22 C 12,22 6,14 1,13 Z" fill="#059669"/>

    <!-- Bottom Embracing Golden Lotus Calyx / Aerodynamic Base -->
    <path d="M -18,18 Q 0,26 18,18 Q 0,30 -18,18 Z" fill="url(#khangGold)"/>

    <!-- Crown Jewel Sparkle -->
    <circle cx="0" cy="-30" r="2.5" fill="#ffffff"/>
  </g>
</svg>