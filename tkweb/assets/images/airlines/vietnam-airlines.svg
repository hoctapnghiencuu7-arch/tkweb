<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vnaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004c8f"/>
      <stop offset="60%" stop-color="#002d5b"/>
      <stop offset="100%" stop-color="#001a38"/>
    </linearGradient>
    <linearGradient id="vnaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="vnaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Deep Maritime Blue Disc -->
  <circle cx="50" cy="50" r="46" fill="url(#vnaBlue)" stroke="url(#vnaGold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>

  <!-- The Iconic Golden Lotus (Sen Vàng) -->
  <g transform="translate(50, 48)" filter="url(#vnaGlow)">
    <!-- Central Tall Lotus Petal -->
    <path d="M 0,-28 
             C 5,-16 8,-4 0,16 
             C -8,-4 -5,-16 0,-28 Z" 
          fill="url(#vnaGold)"/>
    <path d="M 0,-26 C 2,-16 4,-4 0,12 C -4,-4 -2,-16 0,-26 Z" fill="#fef08a" opacity="0.65"/>

    <!-- Inner Left Petal -->
    <path d="M -3,-20 
             C -12,-12 -18,2 -8,15 
             C -3,5 -2,-5 -3,-20 Z" 
          fill="url(#vnaGold)"/>

    <!-- Inner Right Petal -->
    <path d="M 3,-20 
             C 12,-12 18,2 8,15 
             C 3,5 2,-5 3,-20 Z" 
          fill="url(#vnaGold)"/>

    <!-- Outer Left Wing Petal -->
    <path d="M -5,-10 
             C -18,-2 -26,12 -14,21 
             C -8,12 -4,2 -5,-10 Z" 
          fill="url(#vnaGold)"/>

    <!-- Outer Right Wing Petal -->
    <path d="M 5,-10 
             C 18,-2 26,12 14,21 
             C 8,12 4,2 5,-10 Z" 
          fill="url(#vnaGold)"/>

    <!-- Base Cradle Petals -->
    <path d="M -22,16 Q 0,26 22,16 Q 0,21 -22,16 Z" fill="url(#vnaGold)"/>
  </g>
</svg>