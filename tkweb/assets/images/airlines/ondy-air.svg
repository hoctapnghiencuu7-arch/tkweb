<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ondyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ondyOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </linearGradient>
    <linearGradient id="ondyCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="ondyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge Disc -->
  <circle cx="50" cy="50" r="46" fill="url(#ondyBg)" stroke="#ff6b00" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Orbital Supersonic Speed Ring -->
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="url(#ondyCyan)" stroke-width="2.5" transform="rotate(-30, 50, 50)" filter="url(#ondyGlow)"/>

  <!-- Supersonic Delta Jet (Forward-swept, modern) -->
  <g transform="translate(50, 48) rotate(-15)">
    <!-- Jet Body -->
    <path d="M 0,-26 
             L 5,-6 
             L 26,12 
             L 10,14 
             L 4,20 
             L 0,16 
             L -4,20 
             L -10,14 
             L -26,12 
             L -5,-6 Z" 
          fill="url(#ondyOrange)"/>
    <!-- Cockpit & Centerline Highlight -->
    <path d="M 0,-24 L 2.5,-6 L 0,14 L -2.5,-6 Z" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="0" cy="-10" rx="1.8" ry="5" fill="#0f172a"/>
    <!-- Wingtip Jet Glows -->
    <circle cx="26" cy="12" r="2" fill="#38bdf8" filter="url(#ondyGlow)"/>
    <circle cx="-26" cy="12" r="2" fill="#38bdf8" filter="url(#ondyGlow)"/>
    <!-- Afterburner Thrust Flame -->
    <polygon points="-2,18 2,18 0,26" fill="#facc15" filter="url(#ondyGlow)"/>
  </g>
</svg>