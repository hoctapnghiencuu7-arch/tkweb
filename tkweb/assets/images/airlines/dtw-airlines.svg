<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dtwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="dtwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="dtwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Badge with Gold Edge -->
  <circle cx="50" cy="50" r="46" fill="url(#dtwBg)" stroke="url(#dtwGold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#3f3f46" stroke-width="1.2"/>

  <!-- Compass / Speed Rings -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#dtwGold)" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- Golden Aero Wings & Supersonic Chevron -->
  <g transform="translate(50, 50)">
    <!-- Outer Wings -->
    <path d="M 0,-18 
             C 12,-16 28,-8 36,4 
             C 24,4 12,-2 0,4 
             C -12,-2 -24,4 -36,4 
             C -28,-8 -12,-16 0,-18 Z" 
          fill="url(#dtwGold)" filter="url(#dtwGlow)"/>

    <!-- Inner Secondary Wing Layer -->
    <path d="M 0,-8 
             C 10,-6 20,0 26,10 
             C 16,9 8,4 0,8 
             C -8,4 -16,9 -26,10 
             C -20,0 -10,-6 0,-8 Z" 
          fill="#ca8a04"/>

    <!-- Central Diamond Star & Speed Arrow -->
    <polygon points="0,-24 4,-12 12,-8 4,-4 0,16 -4,-4 -12,-8 -4,-12" fill="#ffffff"/>
    <circle cx="0" cy="-8" r="2" fill="#eab308"/>
  </g>
</svg>