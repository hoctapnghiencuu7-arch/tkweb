<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="svGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="svGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="svGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#svGreen)" stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#6ee7b7" stroke-width="0.8" stroke-dasharray="3 2" stroke-opacity="0.5"/>
  
  <!-- Saudia Date Palm & Crossed Scimitars -->
  <g filter="url(#svGlow)" transform="translate(50, 48)">
    <!-- Date Palm Tree Leaves -->
    <path d="M 0 -8 Q -10 -22 -22 -18 Q -12 -12 0 -6" fill="none" stroke="url(#svGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -8 Q 10 -22 22 -18 Q 12 -12 0 -6" fill="none" stroke="url(#svGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -8 Q -14 -14 -24 -6 Q -12 -4 0 -4" fill="none" stroke="url(#svGold)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 -8 Q 14 -14 24 -6 Q 12 -4 0 -4" fill="none" stroke="url(#svGold)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Palm Trunk -->
    <path d="M -2.5 -6 L -1.5 8 L 1.5 8 L 2.5 -6 Z" fill="url(#svGold)"/>
    
    <!-- Crossed Scimitars (Swords) -->
    <!-- Sword 1 -->
    <path d="M -18 18 Q 0 10 18 6" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="-18" cy="18" r="2" fill="url(#svGold)"/>
    <!-- Sword 2 -->
    <path d="M 18 18 Q 0 10 -18 6" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="18" cy="18" r="2" fill="url(#svGold)"/>
  </g>
  <text x="50" y="84" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8.5" text-anchor="middle" fill="#ffffff" letter-spacing="2">SAUDIA</text>
</svg>