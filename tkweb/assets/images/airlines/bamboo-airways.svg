<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="qhGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="qhBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="qhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22c55e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.3"/>
  
  <!-- Stylized Bamboo Leaf & Aerodynamic Wing -->
  <g filter="url(#qhGlow)" transform="translate(50, 48)">
    <!-- Top Emerald Leaf Wing -->
    <path d="M -28 -4 C -18 -26, 12 -28, 30 -14 C 24 -8, 2 -12, -12 2 Z" fill="url(#qhGreen)"/>
    <!-- Middle Azure Leaf Wing -->
    <path d="M -22 6 C -10 -10, 16 -12, 28 2 C 22 6, 4 4, -8 14 Z" fill="url(#qhBlue)"/>
    <!-- Bottom Fresh Leaf Accent -->
    <path d="M -16 16 C -6 6, 14 4, 22 14 C 16 18, 4 16, -6 22 Z" fill="url(#qhGreen)"/>
  </g>
  <text x="50" y="82" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8" text-anchor="middle" fill="#047857" letter-spacing="1.5">BAMBOO</text>
</svg>