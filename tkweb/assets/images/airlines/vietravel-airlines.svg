<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vtrNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vtrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#vtrNavy)" stroke="url(#vtrGold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="#3b82f6" stroke-width="1"/>

  <!-- Soaring Albatross & Voyage Waves -->
  <g transform="translate(50, 50)">
    <!-- Albatross Golden Wings -->
    <path d="M 0,-18 
             C 12,-14 26,-4 34,8 
             C 22,6 12,0 0,6 
             C -12,0 -22,6 -34,8 
             C -26,-4 -12,-14 0,-18 Z" 
          fill="url(#vtrGold)"/>
    <!-- Maritime Blue Wave Crest -->
    <path d="M -22,14 Q 0,22 22,14 Q 0,26 -22,14 Z" fill="#38bdf8"/>
    <!-- Central Flight Jet -->
    <polygon points="0,-22 4,-12 0,-8 -4,-12" fill="#ffffff"/>
  </g>
</svg>